<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favRoofGrad" x1="15%" y1="60%" x2="85%" y2="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="favCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- House Roof & Left Wall (Navy) -->
  <path
    d="M 26 96 L 26 50 L 16 56 L 60 16"
    stroke="#1E293B"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Roof Slope (Teal-Emerald Gradient) -->
  <path
    d="M 60 16 L 104 54 L 95 54"
    stroke="url(#favRoofGrad)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom-left foundation corner -->
  <path
    d="M 26 92 L 44 92"
    stroke="#1E293B"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Human Figure (Navy) -->
  <circle cx="53" cy="34" r="7" fill="#1E293B" />
  <path
    d="M 30 84 C 30 64 38 52 48 48 C 54 45 63 35 72 30 C 70 39 62 50 56 58 C 50 66 46 75 44 84 Z"
    fill="#1E293B"
  />

  <!-- Digital Circuit Traces (Emerald) -->
  <!-- Top Trace -->
  <path
    d="M 62 52 L 86 52"
    stroke="url(#favCircuitGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="86" cy="52" r="4" fill="#10B981" />

  <!-- Middle Trace -->
  <path
    d="M 61 66 L 96 66"
    stroke="url(#favCircuitGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="96" cy="66" r="4" fill="#10B981" />

  <!-- Bottom Trace -->
  <path
    d="M 61 80 L 84 80"
    stroke="url(#favCircuitGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="84" cy="80" r="4" fill="#10B981" />

  <!-- Bottom-Right Foundation Line -->
  <path
    d="M 61 92 L 90 92"
    stroke="#10B981"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Vertical Bus Connecting Traces -->
  <path
    d="M 61 52 L 61 92"
    stroke="#10B981"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
