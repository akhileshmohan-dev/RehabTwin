<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" fill="none">
  <defs>
    <!-- Roof Gradient: dark slate on left to emerald on right -->
    <linearGradient id="roofGrad" x1="15%" y1="60%" x2="85%" y2="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- House Roof & Left Wall -->
  <!-- Left Wall & Left Eave (Dark Navy) -->
  <path
    d="M 32 108 L 32 58 L 22 64 L 68 18"
    stroke="#1E293B"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Roof Slope (Emerald / Teal Gradient) -->
  <path
    d="M 68 18 L 118 62 L 108 62"
    stroke="url(#roofGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom-left foundation corner -->
  <path
    d="M 32 104 L 52 104"
    stroke="#1E293B"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Human Figure (Rehabilitation Patient) -->
  <!-- Head -->
  <circle cx="60" cy="38" r="8" fill="#1E293B" />
  
  <!-- Torso & Dynamic Raised Arm -->
  <path
    d="M 36 94 C 36 72 44 60 56 54 C 62 51 72 40 82 34 C 80 44 70 58 64 66 C 58 74 54 84 52 94 Z"
    fill="#1E293B"
  />

  <!-- Digital Circuit Traces (Twin / Telemetry) -->
  <!-- Circuit Horizontal Lines -->
  <!-- Top Trace -->
  <path
    d="M 72 58 L 98 58"
    stroke="url(#circuitGrad)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <circle cx="98" cy="58" r="4.5" fill="#10B981" />

  <!-- Middle Trace -->
  <path
    d="M 70 74 L 110 74"
    stroke="url(#circuitGrad)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <circle cx="110" cy="74" r="4.5" fill="#10B981" />

  <!-- Bottom Trace -->
  <path
    d="M 70 90 L 96 90"
    stroke="url(#circuitGrad)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <circle cx="96" cy="90" r="4.5" fill="#10B981" />

  <!-- Bottom-Right Foundation Line -->
  <path
    d="M 70 104 L 102 104"
    stroke="#10B981"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Vertical Bus Connecting Traces -->
  <path
    d="M 70 58 L 70 104"
    stroke="#10B981"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Brand Typography -->
  <text x="12" y="140" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#1E293B">Rehab</tspan><tspan fill="#10B981">Twin</tspan>
  </text>
</svg>
