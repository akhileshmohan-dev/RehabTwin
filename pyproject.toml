[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehabtwin-digital-thread"
version = "0.2.0"
description = "PostgreSQL-ready Digital Thread layer for RehabTwin"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[tool.setuptools.packages.find]
include = ["digital_thread*"]
